[project]
name = "hyperliquid-bot"
version = "0.1.0"
description = "Production-grade multi-strategy trading bot for Hyperliquid"
requires-python = ">=3.12"
dependencies = [
    "hyperliquid-python-sdk>=0.5.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    "structlog>=23.2.0",
    "prometheus-client>=0.19.0",
    "aiohttp>=3.9.0",
    "eth-account>=0.11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[project.scripts]
hlbot = "src.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
